<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>le hoang nguyen 26560041 exercise 3</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <div class="wrapper">
        <h2>Infinite Scrolling Marquee</h2>
        <p class="instruction"> Hover the banner to pause it</p>
        
        <div class="marquee">
            <div class="marquee-track">
                <div class="marquee-content">
                    <span>CSS</span>
                    <span>JavaScript</span>
                    <span>Git</span>
                    <span>GitHub</span>
                    <span>VS Code</span>
                    <span>HTML</span>
                </div>

                <div class="marquee-content" aria-hidden="true">
                    <span>CSS</span>
                    <span>JavaScript</span>
                    <span>Git</span>
                    <span>GitHub</span>
                    <span>VS Code</span>
                    <span>HTML</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
