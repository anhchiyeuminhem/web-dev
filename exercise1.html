<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>le hoang nguyen 26560041 exercise 1</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div class="container">
        <h1>Flip Card Gallery</h1>
        <p class="subtitle">Hover a card to see the back</p>

        <div class="card-grid">
            <div class="card-container">
                <div class="card">
                    <div class="card-front">
                        <span class="icon">📡</span>
                        <h2>HTML</h2>
                    </div>
                    <div class="card-back">
                        <h3>HTML</h3>
                        <p>hyper text markup language use for creating web pages.</p>
                    </div>
                </div>
            </div>

            <div class="card-container">
                <div class="card">
                    <div class="card-front">
                        <span class="icon">🎨</span>
                        <h2>CSS</h2>
                    </div>
                    <div class="card-back">
                        <h3>CSS</h3>
                        <p>cascading style sheets is used for styling and layout of web pages.</p>
                    </div>
                </div>
            </div>

            <div class="card-container">
                <div class="card">
                    <div class="card-front">
                        <span class="icon">⚡</span>
                        <h2>JavaScript</h2>
                    </div>
                    <div class="card-back">
                        <h3>JavaScript</h3>
                        <p>programming language that makes web pages interactive and dynamic.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
